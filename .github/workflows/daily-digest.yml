name: Daily News Digest

on:
  schedule:
    # 05:17 UTC = ~06:17 Europe/Rome. Off-peak minute: GitHub delays cron jobs
    # started at :00 during high load, sometimes by hours.
    - cron: '17 5 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily News Digest Agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      # Runs even when the agent exits non-zero, so run-log.json and the digest
      # are preserved for debugging. state.json is only modified on success.
      - name: Commit and push updated state & digest
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json run-log.json digest-*.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: automated daily news digest [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main || echo "[WARN] Git push could not be completed; will sync on next run."
          else
            echo "No changes to commit."
          fi
