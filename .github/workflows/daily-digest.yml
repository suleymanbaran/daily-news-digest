name: Daily News Digest

on:
  schedule:
    # A single daily tick is a single point of failure: GitHub's cron on private
    # repos has fired 10h late here and skipped a day outright, so tick every 30
    # minutes over a wide window and let schedule_gate.py pass one run per day.
    # 06:07-15:37 UTC brackets 09:00 Rome in both CET (08:00 UTC) and CEST
    # (07:00 UTC), leaving ~7h of slack for a late-firing tick to still deliver.
    # Off-peak minutes (:07/:37) dodge GitHub's congested :00/:30 queue.
    - cron: '7,37 6-15 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # Runs before setup-python/pip so a gated-out tick costs ~15s of runtime.
      - name: Check whether today's digest is still pending
        id: gate
        run: python3 schedule_gate.py

      - name: Set up Python
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily News Digest Agent
        if: steps.gate.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      # Runs even when the agent exits non-zero, so run-log.json is preserved for
      # debugging. state.json is only modified on success. The digest itself is a
      # local artifact: it is delivered to Telegram, not published to the repo.
      - name: Commit and push updated state
        if: always() && steps.gate.outputs.should_run == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json run-log.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: automated daily news digest [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main || echo "[WARN] Git push could not be completed; will sync on next run."
          else
            echo "No changes to commit."
          fi
